repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing white space
      - id: end-of-file-fixer
        name: Fix EOFs
      - id: check-yaml
        name: Check YAML files
      - id: check-added-large-files
        name: Check adding large files

  # C++ formatting with clang-format 17
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 05241dc3def184dba136e62d54ff57f1c8a497a9  # v17.0.6
    hooks:
      - id: clang-format
        types_or: [c++]

  # CMake formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: e2c2116d86a80e72e7146a06e68b7c228afc6319  # v0.6.13
    hooks:
      - id: cmake-format
        args: [--config-files, .cmake-format.py, --in-place]

  # Spell-checking
  - repo: https://github.com/crate-ci/typos
    rev: aca895bf05aec0cb7dffa6f94495e923224d9f17  # v1.46.2
    hooks:
      - id: typos
        name: Spell-check for typos
        args: [--force-exclude, --config=./.typos.toml]
        exclude: '\.(csv|json|out)$'
